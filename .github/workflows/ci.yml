name: CI
on:
  push: { branches: [main] }
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 26, cache: npm }
      - run: npm ci
      # Generated files aren't in the tree, so codegen runs before anything reads them.
      - run: npm run codegen
      - name: Lint
        run: npx biome ci .
      - name: Typecheck
        run: npm run check:types
      - name: Test
        run: npm test
