name: philotes
services:
  philotes:
    image: vantreeseba/philotes:latest
    build: .
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required. Generate one with `openssl rand -hex 32`}
      DATABASE_URL: postgres://philotes:${POSTGRES_PASSWORD:-philotes}@postgres:5432/philotes
      APP_URL: ${APP_URL:-http://localhost:3001}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      NODE_ENV: production
      PORT: 3001
    ports:
      - "${PORT:-3001}:3001"
    volumes: [philotes_avatars:/avatars]
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment: { POSTGRES_USER: philotes, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-philotes}", POSTGRES_DB: philotes }
    # No `ports`. The database is for the app beside it.
    volumes: [philotes_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U philotes -d philotes"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  philotes_pgdata:
  philotes_avatars:
