name: philotes
services:
  philotes:
    image: vantreeseba/philotes:latest
    build: .
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required. Generate one with `openssl rand -hex 32`}
      DATABASE_URL: postgres://philotes:${POSTGRES_PASSWORD:-philotes}@postgres:5432/philotes
      APP_URL: ${APP_URL:-http://localhost:3000}
      SECURE_LOCAL_NET: ${SECURE_LOCAL_NET:-false}
      SESSION_STORE: ${SESSION_STORE:-memory}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_FROM: ${SMTP_FROM:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      # Unset, avatars are kept in the philotes_data volume.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
      NODE_ENV: production
    ports:
      - "${PORT:-3000}:3000"
    # Uploaded avatars, unless S3_ENDPOINT sends them to a bucket.
    volumes: [philotes_data:/data]
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment: { POSTGRES_USER: philotes, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-philotes}", POSTGRES_DB: philotes }
    # No `ports`. The database is for the app beside it.
    volumes: [philotes_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U philotes -d philotes"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  philotes_pgdata:
  philotes_data:
